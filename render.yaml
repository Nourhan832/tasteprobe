services:
  - type: web
    name: tasteprobe
    runtime: docker
    plan: free
    repo: https://github.com/Nourhan832/tasteprobe
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: QLOO_API_HOST
        value: https://hackathon.api.qloo.com
      - key: QLOO_TRANSPORT
        value: harness
      - key: QLOO_API_KEY
        sync: false
